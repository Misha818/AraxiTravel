<style>
  .sidebar {
  background-color: #f4f5fa!important;
  height: 100vh!important;
  padding: 20px!important;
  color: #4a4a4a!important;
  border-right: 1px solid #ddd!important;
  position: fixed!important;
  transition: transform 0.5s ease, width 0.5s ease!important;  
  white-space: nowrap!important;
  left: 0!important;
  overflow-x: hidden!important;
  top: 95px!important;
  border-radius: 8px!important;
  z-index: 9999!important;
  line-height: 0.5!important;
}

.sidebar.collapsed {
  transform: translateX(-200px);
  width: 50px;
  padding: 20px 10px;
}

.collapsed {
  transform: translateX(-200px);
  width: 50px;
  padding: 20px 10px;
}


</style>

<!-- <button class="toggle-btn" id="toggle-btn" data-onclick='["toggleSidebar"]'>
  <i class="fas fa-bars"></i>
</button> -->
<nav id="sidebar" class="sidebar" aria-label="{{ _('Tools') }}">
    <!-- <a href="#" class="closebtn">&times;</a> -->

    <ul class="sidebar-menu">
      <li style="border-bottom: 1px solid;"><a href="{{ url_for('home') + 'stuff' }}"{% if request.path == '/stuff' %} class="active" aria-current="page"{% endif %}><i class="fas fa-home"></i><span>{{ _('Dashboard') }}</span></a></li>

    {% for row in result %}
      {% set linkPath = url_for('home') + row['ActionDir'] %}
      {% set isCurrent = request.path == linkPath or request.full_path.rstrip('?') == linkPath %}
      <li><a href="{{ linkPath }}"{% if isCurrent %} class="active" aria-current="page"{% endif %}><i class="{{ row['Img'] }}" aria-hidden="true"></i><span>{{ _(row['ActionName']) }}</span></a></li>
    {% endfor %}
    
    </ul>
