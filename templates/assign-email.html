{% extends 'base.html' %}

{% block head %}

    <link rel="stylesheet" href="{{ url_for('static', filename='dropzon.css') }}">  
    <link rel="stylesheet" href="{{ url_for('static', filename='dropzone.min.css') }}">  
    <link rel="stylesheet" href="{{ url_for('static', filename='cropper.min.css') }}">  

    <style>
        .dz-details:hover {
            cursor: pointer;
        }
    
        .dz-remove-btn:hover {
            background-color: #c82333;
            cursor: pointer;
        }
    
    
        .alt-input:hover {
            cursor: auto;
        }
    
    </style>
{% endblock %}
{% block title %}
    {{ _('Assign an Email') }}
{% endblock %}



{% block content %}

{{ sideBar | safe }}

<div class="overlay" id="overlay"></div>
<div class="containerS admin-form-card">
    <h1>{{ _('Assign an Email') }}</h1>
    <div id="mistakes" style="width: 100%;" role="alert" aria-live="polite"></div>

    <form class="admin-form" novalidate>
        <label for="emails" class="field-label" id="emails-label">{{ _('Email') }}</label>
        <div class="form-group row" id="emailsDropDown"></div>

        <div id="stuff-field" class="field-group">
            <label for="stuff" class="field-label">{{ _('Employee') }}</label>
            <div class="form-group row" id="stuffDropDown"></div>
        </div>


        <input type="hidden" id="language-id" value="{{ languageID }}">

        <div id="saveButton" class="pcButtonS modifiedB" role="button" tabindex="0">{{ _('Submit') }}</div>
        <div id="saving" class="pcButtonS hidden modifiedB" aria-live="polite">{{ _('Saving...') }}</div>
    </form>


</div>


<script nonce="{{ csp_nonce() }}">

document.addEventListener('DOMContentLoaded', function() {
    
    let csrfToken = "{{ csrf_token() }}"

    function stuffDropDown() {

        const stuff = {{ result | tojson }};

        const dropdownContainer = document.getElementById('stuffDropDown');
        if (stuff['length'] > 0) {
            const select = document.createElement('select');
            select.name = 'stuff';
            select.id = 'stuff';
            select.classList.add('form-control');
            select.classList.add('styled-select');
           
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '{{ _("Choose an employee") }}';
            // defaultOption.disabled = true;
            select.appendChild(defaultOption);

            stuff.data.forEach(val => {
                const optVal = val['Initials'] + ' ' + val['Position'];
                if (optVal !== null) {
                    const option = document.createElement('option');
                    option.value = val['ID'];
                 
                    option.textContent = optVal;

                    // option.selected = true;
                    select.appendChild(option);
                }
            });

            dropdownContainer.appendChild(select); // Append the select element to the body or any other specific location
        }
    };


    function emailsDropDown() {

        const emails = {{ resultEmails | tojson }};

        const dropdownContainerEmails = document.getElementById('emailsDropDown');
        if (emails['length'] > 0) {
            const select = document.createElement('select');
            select.name = 'emails';
            select.id = 'emails';
            select.classList.add('form-control');
            select.classList.add('styled-select');
           
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '{{ _("Choose an email") }}';
            // defaultOption.disabled = true;
            select.appendChild(defaultOption);

            emails.data.forEach(val => {
                const optVal = val['email'];
                if (optVal !== null) {
                    const option = document.createElement('option');
                    option.value = val['ID'];
                 
                    option.textContent = optVal;

                    // option.selected = true;
                    select.appendChild(option);
                }
            });

            dropdownContainerEmails.appendChild(select); // Append the select element to the body or any other specific location
        } else {
            const message = "{{ _('No emails available') }}";
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message;
            messageDiv.style.color = 'red';
            messageDiv.style.fontSize = '18px';
            messageDiv.style.boxSizing = 'border-box';
            messageDiv.style.width = '100%';
            messageDiv.style.textAlign = 'center';
            messageDiv.style.border = '1px solid red';
            messageDiv.style.padding = '10px';
            messageDiv.style.borderRadius = '7px';

            const creatMessageBtn = document.createElement('a');
            creatMessageBtn.textContent = "{{ _('Create an email') }}";
            creatMessageBtn.classList.add('pcButtonS');
            creatMessageBtn.classList.add('modifiedB');
            creatMessageBtn.href = "{{ url_for('create_email') }}";
            creatMessageBtn.style.textDecoration = 'none';
            creatMessageBtn.style.boxSizing = 'border-box';
            creatMessageBtn.style.textAlign = 'center';

            const parentDiv = document.createElement('div');
            parentDiv.style.display = 'flex';   
            parentDiv.style.flexDirection = 'column';
            parentDiv.style.alignItems = 'center';  
            parentDiv.style.justifyContent = 'center';
            parentDiv.style.width = '100%';
            parentDiv.style.gap = '10px';
            parentDiv.style.marginBottom = '10px';
            parentDiv.appendChild(messageDiv);
            parentDiv.appendChild(creatMessageBtn); // Append the button to the parent div
            dropdownContainerEmails.appendChild(parentDiv); // Append the parent div to the dropdown container

            // Nothing can be assigned yet: keep only the message and the link to create an email
            document.getElementById('emails-label').classList.add('hidden');
            document.getElementById('stuff-field').classList.add('hidden');
            document.getElementById('saveButton').classList.add('hidden');

        }
    };

    stuffDropDown();
    emailsDropDown();

    // When the form is submitted
    const saveButton = document.getElementById('saveButton');

    // Enter in a field submits through the Submit button (a plain form submit would reload the page)
    const adminForm = document.querySelector('.admin-form');
    adminForm.addEventListener('submit', function (event) {
        event.preventDefault();
    });
    adminForm.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && event.target.classList.contains('text-field')) {
            event.preventDefault();
            if (!saveButton.classList.contains('hidden')) {
                saveButton.click();
            }
        }
    });
    saveButton.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            saveButton.click();
        }
    });

    saveButton.addEventListener('click', function (event) {

        event.preventDefault();
        
        const saveButton = document.getElementById('saveButton');
        const saving = document.getElementById('saving');
        
        saveButton.classList.add('hidden');
        saving.classList.remove('hidden');
        
        let formData = new FormData();
         
        let languageID = document.getElementById('language-id').value;
        const stuffSelect = document.getElementById('stuff');
        const emailSelect = document.getElementById('emails');
        let stuffID = stuffSelect ? stuffSelect.value : '';
        let emailID = emailSelect ? emailSelect.value : '';

        

        
        // Create a new FormData object
        formData.append('languageID', languageID);
        formData.append('stuffID', stuffID);
        formData.append('emailID', emailID);
        

        // Create a new XMLHttpRequest object
        let xhr = new XMLHttpRequest();

        // Configure the request
        xhr.open('POST', '/assign-email');
        xhr.setRequestHeader('X-CSRFToken', csrfToken);

        // Define what happens on successful data submission
        xhr.onload = function () {
            if (xhr.status === 200) {
                let response = JSON.parse(xhr.responseText);

                let mistakesDiv = document.getElementById('mistakes');
                mistakesDiv.innerHTML = ''; // Clear previous messages

                if (response.status === '0') {
                    // Handle empty product name
                    mistakesDiv.innerHTML = safeMessage(response.answer);
                    mistakesDiv.style.color = 'red';
                    mistakesDiv.style.display = 'flex';

                    // Scroll the window to the mistakesDiv with smooth behavior
                    mistakesDiv.scrollIntoView({ behavior: 'smooth' });

                    csrfToken = response.newCSRFtoken;

                    saveButton.classList.remove('hidden');
                    saving.classList.add('hidden');

                } 
                
                if (response.status === '1') {

                    alert(response.answer)
                    // Handle success
                    window.location.reload();

                    // location.reload();
                }
            } else {
                // Handle error response
                saveButton.classList.remove('hidden');
                saving.classList.add('hidden');

                console.error('Error adding category:', xhr.responseText);
            }
        };

        // Send the request with the FormData object
        xhr.send(formData);
    });

});

</script>


{% endblock %}
